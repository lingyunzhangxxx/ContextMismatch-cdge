[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "context-mismatch-cdge"
version = "0.1.0"
description = "Experiment code for context mismatch and Composite Directional Governance Editing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
analysis = ["reportlab==4.4.10"]
experiment = [
  "numpy==2.2.6",
  "torch==2.7.1",
  "transformers==5.13.1",
  "accelerate==1.15.0",
  "datasets==4.8.5",
]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 100
