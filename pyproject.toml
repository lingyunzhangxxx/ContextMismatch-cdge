[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "context-mismatch-cdge"
version = "0.1.0"
description = "Experiment code for context mismatch and Composite Directional Governance Editing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
analysis = ["reportlab>=4.0,<5"]
experiment = [
  "numpy>=1.26,<3",
  "torch>=2.7,<3",
  "transformers>=5.12,<6",
  "accelerate>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 100
